  - "examples/showcases/banking"
  - "examples/showcases/reskinnable-demo"
  - "examples/slack"
  - "examples/teams"
  - "!examples/v1/_legacy"
  - "showcase/scripts"
  - "showcase/harness"
  - "showcase/eval-webhook"
  - "showcase/angular"
  # NOTE: `showcase/shell-dashboard` is intentionally NOT part of this
  # pnpm workspace. It's a flat, standalone Next.js app that ships its
  # own package-lock.json and is built with `npm ci` (see its Dockerfile).
  # Including it here would force it into the pnpm lockfile, which
  # breaks its independent deploy path and invalidates the npm-based
  # Docker build. `showcase/scripts` IS in the workspace because the
  # harness package imports from it and both use pnpm.
onlyBuiltDependencies:
  - better-sqlite3
  # Required by `examples/showcases/reskinnable-demo` (banking's Arm A harness,
  # via `@tanstack/ai-claude-code`). Its postinstall is what LINKS the already-
  # downloaded platform binary into `bin/claude.exe`; blocked, pnpm still puts a
  # `claude` shim on `node_modules/.bin` — which shadows any host install inside
  # `pnpm dev` — and every harness run dies with "claude native binary not
  # installed". Costs no extra download or disk: the 241MB payload arrives as an
  # optional dependency regardless, and the script only hardlinks it.
  - "@anthropic-ai/claude-code"
