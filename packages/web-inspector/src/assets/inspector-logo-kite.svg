<?xml version="1.0" encoding="utf-8"?>
<!--
  CopilotKit Kite mark. Artwork copied verbatim from the official small-size
  export (website public/icons/copilotkit-kite.svg) - do not redraw it.

  The only change is the viewBox: every path is untouched, so this is a window
  onto the artwork rather than a redrawing, and it is reversible.

  The source is not centred in its own box. A hairline string runs from the kite
  to the far lower-left (x 0.16, y 26.36) and drags the bounding box with it, so
  centring on everything leaves the kite up and to the right - measured, 7.3 px
  right and 6.7 px high at a 112 px render.

  The box below is centred on the SAILS instead, which is the only part a reader
  can recognise at this size. Sail bounds are x 6.34..20.60, y 3.70..20.83,
  centre (13.47, 12.26); the box is that centre with a square side of 17.8,
  giving roughly 2% of air on every edge.

  Consequences, all deliberate: the string and the tail ribbon fall outside the
  window. At a 20 px render the string's 0.30-unit stroke is under one device
  pixel and cannot draw as a line, and the tail becomes three or four muddy
  pixels, so they cost about 40% of the box and return almost nothing. Dropping
  them puts the kite at 53% of the launcher's height instead of 38%.

  If the artwork is ever re-exported, check the sail bounds again before trusting
  this box: the 2% margin absorbs small drift, not a re-composition.
-->
