[project]
name = "research-desk-agent"
version = "0.1.0"
description = "Google ADK research agent for the A2UI Research Desk showcase, served over AG-UI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2ui-agent-sdk==0.9.0",
    "a2ui-core==0.4.0",
    "ag-ui-adk==0.11.0",
    "ag-ui-protocol==1.0.0",
    "composio==0.30.0",
    # composio pins this pre-release, which uv does not pick on its own.
    "composio-client==2.0.0rc19",
    "composio-google-adk==0.30.0",
    "google-adk==2.13.0",
    "google-genai==2.33.0",
    "fastapi>=0.115",
    "json-repair==0.64.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
