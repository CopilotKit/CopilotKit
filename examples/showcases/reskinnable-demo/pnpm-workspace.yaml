# This app is its OWN pnpm root, and that is what makes it installable.
#
# It is deliberately absent from the repo's root `pnpm-workspace.yaml` so its
# `@ag-ui/*` / `@copilotkit/*` canary line cannot leak into the rest of the
# monorepo. But dropping out of the member list is only half of it: pnpm walks
# UP from the cwd looking for a workspace root, finds the repo's, and installs
# THAT. Measured — `pnpm install` in this directory reported
# "Scope: all 70 workspace projects", resolved 4645 packages for the monorepo,
# and left this app with no `node_modules` at all. The next command then fails
# with `sh: 1: eslint: not found`, which reads as a broken toolchain rather than
# an install that went somewhere else entirely.
#
# This file stops the walk. `ignore-workspace=true` in an `.npmrc` does NOT —
# it is a CLI-only flag in pnpm 10.10 (measured: the Scope line was unchanged).
packages:
  - "."

# The @ag-ui canary overrides are GONE, deliberately.
#
# They existed for one reason: a released `@ag-ui/core` rejected `SUBAGENT_*`
# events in the HTTP transport before any middleware ran, which killed banking's
# harness console. Those events now ship in stable 0.0.59 (verified:
# SUBAGENT_STARTED / SUBAGENT_FINISHED / SUBAGENT_ERROR are in its published
# types), and @copilotkit 1.71.0 depends on exactly 0.0.59 — so the overrides
# would now pin the tree BEHIND its own dependency rather than ahead of it.
#
# The matching copies under `pnpm.overrides` in package.json are removed too;
# the note that used to live here said to delete both once the canary line
# shipped stable, and it has.
