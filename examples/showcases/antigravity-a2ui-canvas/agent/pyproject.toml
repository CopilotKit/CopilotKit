[project]
name = "antigravity-a2ui-canvas-agent"
version = "0.1.0"
description = "A Google Antigravity agent that builds an A2UI canvas through CopilotKit"
requires-python = ">=3.11,<3.15"
dependencies = [
  # The adapter pins google-antigravity to <0.2.0. The SDK wheel bundles the Go
  # `localharness` binary, so there is no separate download step.
  "ag-ui-antigravity==0.2.1",
  "google-antigravity==0.1.22",
  "ag-ui-protocol==1.0.0",
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "python-dotenv==1.0.1",
  "a2ui-agent-sdk==0.10.0",
  "a2ui-core==0.5.0",
]

# A plain script (main.py), not an installable package.
[tool.uv]
package = false
