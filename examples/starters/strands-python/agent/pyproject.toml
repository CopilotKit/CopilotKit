[project]
name = "aws-strands-server"
version = "0.1.0"
description = "Strands integration server for AG-UI using OpenAI models"
authors = [{ name = "AG-UI Contributors" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ag-ui-protocol==1.0.0",
  "fastapi>=0.115.12",
  "uvicorn>=0.34.3",
  "strands-agents[OpenAI,anthropic,gemini]==1.64.0",
  "strands-agents-tools==0.2.16",
  "ag_ui_strands==1.0.3",
  "openai==1.109.1",
  "python-dotenv>=1.0.0,<2.0.0",
  "pydantic>=2.0.0,<3.0.0",
]
