[project]
name = "agent"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "copilotkit==0.1.96",
  "langchain==1.2.15",
  "langchain-openai==1.1.9",
  "langchain-anthropic==1.4.1",
  "langgraph==1.1.6",
  "langsmith==0.7.33",
  "openai==1.109.1",
  "fastapi>=0.115.5,<1.0.0",
  "uvicorn>=0.29.0,<1.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  # 0.0.44, NOT 0.0.43 — matches this starter's Dockerfile pin and the reason
  # recorded there: ag-ui-langgraph 0.0.43's clone(), which the fastapi endpoint
  # calls on EVERY request, forwards enable_legacy_on_interrupt_event and two
  # sibling flags unconditionally, while the published copilotkit 0.1.96's
  # LangGraphAGUIAgent.__init__ accepts only (name, graph, description, config),
  # so every run 500s. Measured against copilotkit 0.1.96: 0.0.42 OK, 0.0.43
  # FAILS, 0.0.44 OK, 0.0.45 OK.
  "ag-ui-langgraph[fastapi]==0.0.44",
  # 0.1.22, NOT 0.1.19: ag-ui-langgraph 0.0.44 requires ag-ui-protocol>=0.1.21,
  # so 0.1.19 makes the pin above unsatisfiable. 0.1.22 is also what this
  # starter's Dockerfile already installs — it pins ag-ui-langgraph and lets
  # ag-ui-protocol resolve transitively — so this closes a second image/local
  # drift rather than opening one.
  "ag-ui-protocol==0.1.22",
  "pydantic>=2.0.0,<3.0.0",
]
