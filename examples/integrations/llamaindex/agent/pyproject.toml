[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
  "llama-index-core>=0.14,<0.15",
  "llama-index-llms-openai>=0.8.1,<0.9.0",
  "llama-index-protocols-ag-ui>=0.5.0,<0.6.0",
  "jsonpatch>=1.33",
  "uvicorn>=0.27.0",
  "fastapi>=0.100.0",
  "python-dotenv>=1.0.0",
]
authors = [{ name = "Logan Markewich", email = "logan@runllama.ai" }]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.sdist]
include = ["main.py", "src/"]

[tool.hatch.build.targets.wheel]
include = ["main.py", "src/"]

[project.scripts]
dev = "main:main"
