name: examples / parallel research

on:
  pull_request:
    paths:
      - "examples/showcases/parallel-research/**"
      - ".github/workflows/parallel-research.yml"
  push:
    branches: [main]
    paths:
      - "examples/showcases/parallel-research/**"
      - ".github/workflows/parallel-research.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/showcases/parallel-research
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/showcases/parallel-research/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
