name: Intelligence smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      NX_DAEMON: "false"
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - name: Install pinned k3d
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-bin"
          curl --fail --silent --show-error --location https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 -o "$RUNNER_TEMP/smoke-bin/k3d"
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  $RUNNER_TEMP/smoke-bin/k3d" | sha256sum --check
          chmod +x "$RUNNER_TEMP/smoke-bin/k3d"
          echo "$RUNNER_TEMP/smoke-bin" >> "$GITHUB_PATH"
      - name: Install candidate SDK build dependencies
        run: pnpm install --filter @copilotkit/runtime... --filter CopilotKit --frozen-lockfile --ignore-scripts
      - name: Test failure paths
        run: pnpm nx run intelligence-smoke:test
      - name: Check smoke code
        run: pnpm nx run intelligence-smoke:lint
      - name: Run candidate SDK against pinned public Intelligence
        run: pnpm nx run intelligence-smoke:run -- --output="$RUNNER_TEMP/intelligence-smoke-results"
      - name: Prove an incorrect expected reply fails
        env:
          NEGATIVE_OUTPUT: ${{ runner.temp }}/intelligence-smoke-negative
        run: |
          if pnpm nx run intelligence-smoke:run -- --output="$NEGATIVE_OUTPUT" --expect-reply=BROKEN; then
            echo "An incorrect reply expectation passed"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const read = name => readFileSync(`${process.env.NEGATIVE_OUTPUT}/${name}`, "utf8");
          const result = JSON.parse(read("result.json"));
          assert.equal(result.status, "failed");
          assert.deepEqual(result.cleanup, {model: "passed", stack: "passed", temporary: "passed"});
          assert.equal(result.checks.thread, "failed");
          assert.equal(result.checks.learning, "not_run");
          assert.match(read("proof.log"), /Thread proof timed out/);
          assert.deepEqual(JSON.parse(read("model-requests.json")).map(({phase, status}) => [phase, status]), [["agent", 200]]);
          NODE
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intelligence-smoke-results
          path: |
            ${{ runner.temp }}/intelligence-smoke-results/
            ${{ runner.temp }}/intelligence-smoke-negative/
          if-no-files-found: error
          retention-days: 14
