name: Intelligence compatibility monitor
run-name: compatibility-${{ fromJSON(inputs.request).requestId }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated exact-version compatibility request JSON
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: compatibility-${{ fromJSON(inputs.request).requestId }}
  cancel-in-progress: false
jobs:
  compatibility:
    # setup-python has no Python 3.11.13 build for Ubuntu 26.04.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Validate before external commands
        id: request
        env:
          COMPATIBILITY_REQUEST: ${{ inputs.request }}
        run: node harness/tools/compatibility-monitor/prepare.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.request.outputs.sourceSha }}
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.7"
          enable-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.414
            9.0.305
      - name: Install pinned build tools
        working-directory: candidate
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute isolated consumer
        run: node harness/tools/compatibility-monitor/run.mjs request.json candidate compatibility-output
      - name: Preserve evidence including setup failures
        if: ${{ always() && steps.request.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-result-${{ steps.request.outputs.requestId }}
          path: compatibility-output/
          if-no-files-found: error
          retention-days: 90
