name: static / docs snippets

# Type-checks every ts/tsx/js/jsx code fence in the docs against the
# CopilotKit source with kiira (see kiira.config.ts). A page fails when it
# imports an API that was renamed, removed or tagged @deprecated.
#
# It runs on package changes as well as docs changes: renaming or removing an
# export is exactly what breaks a page that still teaches it.

on:
  push:
    branches: [main]
    paths:
      - "showcase/shell-docs/src/content/**"
      - "packages/**"
      - "kiira.config.ts"
      - "tsconfig.docs.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/static_docs-snippets.yml"
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "showcase/shell-docs/src/content/**"
      - "packages/**"
      - "kiira.config.ts"
      - "tsconfig.docs.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/static_docs-snippets.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-docs-snippets:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token: write is required for Depot OIDC auth (runs-on: depot-ubuntu-*).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Checks the unbuilt source, so no package build is needed first. The
      # github reporter turns each failing fence into an inline annotation.
      - run: pnpm nx run repo-scripts:check-docs-snippets --reporter=github
