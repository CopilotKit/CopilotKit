name: test / Claude Managed Agents starter

on:
  pull_request:
    paths:
      - examples/integrations/claude-managed-agents/**
      - .github/workflows/test_claude-managed-starter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-managed-starter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/integrations/claude-managed-agents
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/integrations/claude-managed-agents/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: claude-managed-starter-browser
          path: examples/integrations/claude-managed-agents/test-results
          if-no-files-found: ignore
