name: release / RubyGems

on:
  pull_request:
    paths:
      - .github/workflows/publish-rubygems.yml
      - packages/runtime-ruby/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested gem to RubyGems.org
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rubygems-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.3"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bundle install --gemfile packages/runtime-ruby/Gemfile
      - name: Test, lint, and build the gem
        run: BUNDLE_GEMFILE="$PWD/packages/runtime-ruby/Gemfile" bundle exec pnpm nx run-many -t test,lint,build -p runtime-ruby --parallel=1
      - name: Test Rack runtime protocol conformance
        run: BUNDLE_GEMFILE="$PWD/packages/runtime-ruby/Gemfile" bundle exec pnpm nx run runtime-ruby:test-rack
      - name: Test installation without source references
        run: pnpm nx run runtime-ruby:verify-distribution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby-gem
          path: /tmp/copilotkit-runtime.gem
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruby-gem
          path: artifacts
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.3"
      # RubyGems publisher: CopilotKit/CopilotKit, publish-rubygems.yml,
      # environment rubygems, gem copilotkit-runtime.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push artifacts/copilotkit-runtime.gem --host https://rubygems.org
