name: release / RubyGems

on:
  pull_request:
    paths:
      - .github/workflows/publish-rubygems.yml
      - packages/runtime-ruby/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested gem to RubyGems.org
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rubygems-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bundle install --gemfile packages/runtime-ruby/Gemfile
      - name: Test, lint, and build the gem
        run: BUNDLE_GEMFILE="$PWD/packages/runtime-ruby/Gemfile" bundle exec pnpm nx run-many -t test,lint,build -p runtime-ruby --parallel=1
      - name: Test Rack runtime protocol conformance
        run: |
          pnpm nx run @copilotkit/core:build
          BUNDLE_GEMFILE="$PWD/packages/runtime-ruby/Gemfile" bundle exec pnpm nx run runtime-ruby:test-rack
      - name: Test installation without source references
        run: pnpm nx run runtime-ruby:verify-distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-gem
          path: /tmp/copilotkit-runtime.gem
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruby-gem
          path: artifacts
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
      # RubyGems publisher: CopilotKit/CopilotKit, publish-rubygems.yml,
      # environment rubygems, gem copilotkit-runtime.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push artifacts/copilotkit-runtime.gem --host https://rubygems.org
