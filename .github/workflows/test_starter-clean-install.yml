name: test / starter clean install

# The dynamic half of PE-140.
#
# WHAT HOLE THIS FILLS
# --------------------
# Twenty-two starters live under examples/integrations/. test_smoke-starter.yml
# builds fourteen of them in docker. Nothing installed the other eight, and
# BOTH starters that reached a developer broken were in that eight:
#
#   PE-129  a2a-middleware      — unconstrained `a2a-sdk[http-server]`; the 1.x
#                                 release dropped `a2a.server.apps` and two of
#                                 the three agents died on import. No commit of
#                                 ours was involved.
#   PE-38   claude-sdk-python   — `recharts` needs `react-is`, which the
#                                 starter never declared.
#
# So this job's matrix is DERIVED, not written down: every starter directory
# that the smoke matrix does not already cover
# (.github/scripts/starter-clean-install-matrix.mjs). A new starter is covered
# on the next run with no edit here. That is the point — the hole was a
# hand-maintained list, so the fix must not be another one.
#
# TRIGGER — why a schedule and not only a pull request
# ----------------------------------------------------
# PE-129's defect arrived when a2a-sdk published 1.x, not when we changed a
# file. A per-pull-request job would have missed it entirely, because there was
# no pull request. The daily `schedule` is therefore the primary trigger. The
# `pull_request` trigger is a narrow extra: it runs only for starters whose own
# directory changed, so a manifest edit is checked at the moment it lands.
#
# DEPTH — install and import, not end-to-end
# ------------------------------------------
# PE-129 would have been caught by importing the agents' modules; PE-38 by a
# build. Neither needed a running agent. An end-to-end across the fleet would
# cost far more and catch no more of this defect class.
#
# COST — measured on an 8-core darwin box, warm npm/pip caches:
#   a2a-middleware (Next build + 11 pip deps + 3 module imports): 63s
#   the eight-starter matrix runs in parallel, so wall time is the slowest
#   starter, not the sum. Expect 5-12 min on ubuntu-latest with cold caches.
# Runs once a day plus on starter-directory pull requests, so the network cost
# is roughly one clean resolve per starter per day.

on:
  schedule:
    # Daily. The failure mode is an upstream publishing, which has no commit of
    # ours to hang a trigger on.
    - cron: "0 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - "examples/integrations/**"
      - ".github/scripts/starter-clean-install.sh"
      - ".github/scripts/starter-clean-install-matrix.mjs"
      - ".github/scripts/print-pyproject-deps.mjs"
      - ".github/workflows/test_starter-clean-install.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Every starter the docker smoke matrix does not build.
          UNCOVERED=$(node .github/scripts/starter-clean-install-matrix.mjs)
          node .github/scripts/starter-clean-install-matrix.mjs --explain

          if [ "$EVENT_NAME" != "pull_request" ]; then
            MATRIX="$UNCOVERED"
          else
            # Narrow to starters whose own directory changed. A starter broken
            # by an upstream publish has no diff to detect, which is what the
            # daily schedule above is for.
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- examples/integrations \
              | cut -d/ -f3 | sort -u | jq -R . | jq -sc .)
            MATRIX=$(jq -cn --argjson all "$UNCOVERED" --argjson changed "$CHANGED" \
              '[$all[] | . as $slug | select($changed | index($slug) != null)]')
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No uncovered starter changed — clean-install skipped. The daily schedule runs all of them."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Clean install will run for: $MATRIX"
          fi

  clean-install:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
    strategy:
      fail-fast: false
      matrix:
        starter: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.13 is the only version every uncovered starter accepts:
          # a2a-a2ui requires >=3.13 and agentcore's agents require >=3.13,<3.14,
          # while claude-sdk-python caps at <3.14.
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Clean install ${{ matrix.starter }}
        env:
          STARTER: ${{ matrix.starter }}
        run: .github/scripts/starter-clean-install.sh "$STARTER"

      - name: Alert Slack on failure
        if: failure() && env.SLACK_WEBHOOK != '' && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_OSS_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            { "text": ${{ toJSON(format(':x: `[ci:{2}]` *Starter will not install from a clean state: {0}* — a developer cloning it today gets the same failure{4}<{1}/{2}/actions/runs/{3}|View run>', matrix.starter, github.server_url, github.repository, github.run_id, fromJSON('"\n"'))) }} }
