name: Intelligence bounded row1 (build images only)
on:
  workflow_dispatch:
  push:
    branches: [test/pni-596-rich-intelligence-persistence]
    paths:
      - tools/intelligence-smoke/rich-threads/**
      - tools/railway-disposable-proof/**
      - showcase/scripts/railway-envs.ts
      - showcase/harness/src/shared/railway-lifecycle*
      - .github/workflows/intelligence-rich-threads-build.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: pnpm install --filter CopilotKit --frozen-lockfile --ignore-scripts
      - name: Stage exact committed application sources
        run: >-
          pnpm nx run intelligence-smoke:rich-threads-prepare --
          --output="$RUNNER_TEMP/rich-app"
          --pins=tools/intelligence-smoke/rich-threads/application/package-pins.json
      - name: Stage actual Strands native sources
        run: >-
          pnpm nx run intelligence-smoke:rich-threads-prepare-native --
          --output="$RUNNER_TEMP/rich-strands"
      - name: Stage committed permanent runner sources
        run: >-
          pnpm nx run intelligence-smoke:rich-threads-prepare-runner --
          --output="$RUNNER_TEMP/rich-runner"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push application/runtime/Mastra image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/rich-app
          push: true
          tags: ghcr.io/copilotkit/rich-thread-application:${{ github.sha }}
      - name: Build and push actual Strands native image
        id: strands
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/rich-strands
          push: true
          tags: ghcr.io/copilotkit/rich-thread-strands:${{ github.sha }}
      - name: Build and push permanent Railway runner image
        id: runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/rich-runner
          file: ${{ runner.temp }}/rich-runner/tools/intelligence-smoke/rich-threads/lifecycle/railway/runner/Dockerfile
          push: true
          tags: ghcr.io/copilotkit/rich-thread-runner:${{ github.sha }}
      - name: Record immutable build outputs for independent approval
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          STRANDS_DIGEST: ${{ steps.strands.outputs.digest }}
          RUNNER_DIGEST: ${{ steps.runner.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync, mkdirSync, copyFileSync} from 'node:fs';
          mkdirSync('candidate-build');
          writeFileSync('candidate-build/image-candidates.json', JSON.stringify({revision:process.env.GITHUB_SHA, application:`ghcr.io/copilotkit/rich-thread-application@${process.env.APP_DIGEST}`, strands:`ghcr.io/copilotkit/rich-thread-strands@${process.env.STRANDS_DIGEST}`, runner:`ghcr.io/copilotkit/rich-thread-runner@${process.env.RUNNER_DIGEST}`, approved:false},null,2));
          copyFileSync(`${process.env.RUNNER_TEMP}/rich-app/source.json`, 'candidate-build/application-source.json');
          copyFileSync(`${process.env.RUNNER_TEMP}/rich-strands/source-manifest.json`, 'candidate-build/strands-source.json');
          copyFileSync(`${process.env.RUNNER_TEMP}/rich-runner/source-manifest.json`, 'candidate-build/runner-source.json');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-row1-image-candidates
          path: candidate-build
          if-no-files-found: error
