name: static / react ui

# PE-1070. Runs React Doctor and impeccable detect on the React UI code a
# change touches in packages/, examples/, and showcase/, and fails on what they
# find. Only changed code is checked, so existing findings need no baseline.
# How to fix a failure: dev-docs/react-ui-checks.md.
#
# No `paths` filter, so the job can be a required check: a path-filtered
# workflow never reports on a PR it skips, and that blocks the merge. When
# nothing React-related changed, both steps exit 0 right away.

on:
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-ui:
    name: React Doctor and impeccable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      IMPECCABLE_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull_request checkout is GitHub's merge commit, so HEAD^1 is the
          # base branch tip and HEAD^1..HEAD is exactly the PR's change. On
          # push, HEAD^1 is the previous commit on the branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Setup pnpm
        # Omit `version:` so pnpm/action-setup inherits from the repo's
        # `packageManager` field in package.json (via corepack).
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # setup-node built-in cache is fork-safe (fork PRs can't write to base repo cache)
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: React Doctor
        run: pnpm lint:react-doctor HEAD^1

      - name: impeccable detect
        # Run even when React Doctor failed, so one push shows both results.
        if: ${{ !cancelled() }}
        run: pnpm lint:impeccable HEAD^1
