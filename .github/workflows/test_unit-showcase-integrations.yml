name: test / unit / showcase-integrations

# Unit tests that live INSIDE a showcase integration's own source tree.
#
# Standalone integrations install their own dependencies and are not covered
# by the package unit workflow or the harness suite in test_unit-showcase.yml.
# The Python suites are gated separately by showcase_validate.yml.
#
# This workflow gates Strands TypeScript's agent tests, the shared integration
# utilities, and Omnara's standalone Node test suite.

on:
  pull_request:
    paths:
      - "showcase/integrations/strands-typescript/src/agent/**"
      - "showcase/integrations/strands-typescript/src/cvdiag/**"
      - "showcase/integrations/_shared/ts/**"
      - "showcase/integrations/omnara/**"
      - ".github/workflows/test_unit-showcase-integrations.yml"
  push:
    branches: [main]
    paths:
      - "showcase/integrations/strands-typescript/src/agent/**"
      - "showcase/integrations/strands-typescript/src/cvdiag/**"
      - "showcase/integrations/_shared/ts/**"
      - "showcase/integrations/omnara/**"
      - ".github/workflows/test_unit-showcase-integrations.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showcase-integrations-unit:
    name: "showcase integrations unit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Omit `version:` so pnpm/action-setup inherits from the repo's
        # packageManager field, matching the other showcase workflows.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the agent package's own dependencies
        # The integration is deliberately outside the pnpm workspace: its agent
        # process resolves openai and @strands-agents from its OWN
        # node_modules, installed here exactly as the Dockerfile does. Without
        # this the tests fail on a clean checkout with "Cannot find package
        # '@strands-agents/sdk'" while passing on any machine that happens to
        # have the directory already.
        working-directory: showcase/integrations/strands-typescript/src/agent
        run: npm ci --legacy-peer-deps

      - name: Run agent unit tests
        # The config is the one that already lives beside the tests, so this
        # runs exactly what a developer runs with `npm test` in that directory.
        # `--passWithNoTests` is deliberately NOT set, so an include list that
        # stops matching fails the job instead of reporting an empty success.
        working-directory: showcase/integrations/strands-typescript/src/agent
        run: pnpm exec vitest run --config vitest.config.ts

      - name: Run shared integration unit tests
        # `_shared/ts` is the single source every integration links in (the
        # demos' theme bootstrap, the CVDIAG emitter barrel). Its tests need
        # only the root workspace install.
        run: pnpm exec vitest run --config showcase/integrations/_shared/ts/vitest.config.ts

      - name: Install Omnara integration dependencies
        working-directory: showcase/integrations/omnara
        run: npm ci

      - name: Run Omnara integration unit tests
        run: pnpm exec nx run showcase-omnara:test --skip-nx-cache
