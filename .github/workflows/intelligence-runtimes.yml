name: test / intelligence runtimes

on:
  pull_request:
    branches: [main]
  # No `paths` filter: the scope job's gate.mjs is the single source of truth
  # for which changes need the matrix, and it skips the matrix otherwise.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each push to main gets its own group: the scope job diffs only that push,
  # so a later unrelated push must not cancel or replace an earlier runtime run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  NX_TUI: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  scope:
    name: Runtime change scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test gate decisions
        run: node --test tools/runtime-conformance/test/gate.test.mjs
      - name: Find runtime changes
        id: scope
        env:
          # pull_request diffs the merge commit against its first parent, so
          # BASE_SHA stays empty there; PR_HEAD_SHA confirms that commit is
          # GitHub's merge of the PR head. workflow_dispatch runs everything.
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/runtime-conformance/gate.mjs scope >> "$GITHUB_OUTPUT"

  conformance:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: IntelligenceRunner / ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Ruby runs as two legs so the Rack and Rails suites run in parallel.
        # The gate job reads the aggregate matrix result, so both must pass.
        language: [typescript, python, go, ruby-rack, ruby-rails, dotnet]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup uv
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.7"
          enable-cache: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/runtime-go/go.mod
          cache-dependency-path: packages/runtime-go/go.sum

      - name: Setup Ruby
        if: startsWith(matrix.language, 'ruby-')
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler: "2.4.22"

      - name: Setup .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public runtime, frontend client, and dependencies
        # Every language exercises the built public frontend client. The TypeScript
        # driver also imports public runtime exports, never a source shim.
        run: pnpm nx run-many -t build -p @copilotkit/runtime,@copilotkit/core --parallel=1

      - name: Validate shared harness
        run: pnpm nx run-many -t test,lint -p runtime-conformance

      - name: Validate TypeScript library
        if: matrix.language == 'typescript'
        run: pnpm nx run-many -t test,check-types,check-dts -p @copilotkit/runtime

      - name: TypeScript shared conformance
        if: matrix.language == 'typescript'
        run: |
          pnpm nx run runtime-conformance:conformance -- -- node tools/runtime-conformance/typescript-driver.mjs
          touch "$RUNNER_TEMP/conformance-suite-ran"

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: uv sync --project packages/runtime-python --locked --python 3.11

      - name: Validate Python library
        if: matrix.language == 'python'
        run: pnpm nx run-many -t test,lint,typecheck,build -p runtime-python

      - name: Python shared conformance
        if: matrix.language == 'python'
        run: |
          pnpm nx run runtime-conformance:conformance -- -- packages/runtime-python/.venv/bin/python packages/runtime-python/examples/conformance.py
          touch "$RUNNER_TEMP/conformance-suite-ran"

      - name: Install Go dependencies
        if: matrix.language == 'go'
        run: pnpm nx exec --projects=runtime-go -- go -C "$PWD/packages/runtime-go" mod download

      - name: Validate Go library
        if: matrix.language == 'go'
        run: pnpm nx run-many -t test,lint,build -p runtime-go

      - name: Build Go driver
        if: matrix.language == 'go'
        run: pnpm nx exec --projects=runtime-go -- go -C "$PWD/packages/runtime-go" build -o "$RUNNER_TEMP/runtime-go-conformance" ./cmd/conformance

      - name: Go shared conformance
        if: matrix.language == 'go'
        # Run the binary directly so shutdown cannot leave a go-run child behind.
        run: |
          pnpm nx run runtime-conformance:conformance -- -- "$RUNNER_TEMP/runtime-go-conformance"
          touch "$RUNNER_TEMP/conformance-suite-ran"

      - name: Install Ruby dependencies
        if: matrix.language == 'ruby-rack'
        run: bundle install --gemfile packages/runtime-ruby/Gemfile

      - name: Install Rails dependencies
        if: matrix.language == 'ruby-rails'
        run: |
          # The checked-in Rails lock lists x86_64-linux and a nokogiri with a
          # precompiled Ruby 3.3 build, so nokogiri no longer compiles from
          # source. Smaller native gems such as psych, date, and bigdecimal
          # still do. Frozen mode fails the step instead of re-resolving if
          # the lock goes stale.
          BUNDLE_FROZEN=true bundle install --gemfile packages/runtime-ruby/examples/rails/Gemfile

      - name: Validate Ruby library
        if: matrix.language == 'ruby-rack'
        run: BUNDLE_GEMFILE="$PWD/packages/runtime-ruby/Gemfile" bundle exec pnpm nx run-many -t test,lint,build -p runtime-ruby

      - name: Ruby Rack shared conformance
        if: matrix.language == 'ruby-rack'
        run: |
          pnpm nx run runtime-ruby:test-rack
          touch "$RUNNER_TEMP/conformance-suite-ran"

      - name: Real Rails shared conformance
        if: matrix.language == 'ruby-rails'
        run: |
          pnpm nx run runtime-ruby:test-rails
          touch "$RUNNER_TEMP/conformance-suite-ran"

      - name: Restore .NET dependencies
        if: matrix.language == 'dotnet'
        run: |
          pnpm nx exec --projects=runtime-dotnet -- dotnet restore "$PWD/packages/runtime-dotnet/driver/Runtime.Driver.csproj"
          pnpm nx exec --projects=runtime-dotnet -- dotnet restore "$PWD/packages/runtime-dotnet/tests/Runtime.Tests.csproj"

      - name: Validate .NET library
        if: matrix.language == 'dotnet'
        # These targets share MSBuild output paths, so do not run them concurrently.
        run: pnpm nx run-many -t test,lint,check-types,build,pack -p runtime-dotnet --parallel=1

      - name: .NET shared conformance
        if: matrix.language == 'dotnet'
        run: |
          pnpm nx run runtime-conformance:conformance -- -- dotnet packages/runtime-dotnet/driver/bin/Release/net8.0/Runtime.Driver.dll
          touch "$RUNNER_TEMP/conformance-suite-ran"

      - name: Require a shared conformance suite
        # Each shared conformance step above writes this marker. A matrix value
        # or step condition that selects none of them would otherwise pass the
        # leg after only the shared setup, so fail the leg instead.
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ ! -f "$RUNNER_TEMP/conformance-suite-ran" ]; then
            echo "::error::No shared conformance suite ran for matrix leg '$LANGUAGE'."
            exit 1
          fi

  gate:
    name: Intelligence runtime conformance
    if: always()
    needs: [scope, conformance]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the full matrix for runtime changes
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CONFORMANCE_REQUIRED: ${{ needs.scope.outputs.required }}
          MATRIX_RESULT: ${{ needs.conformance.result }}
        run: node tools/runtime-conformance/gate.mjs check
