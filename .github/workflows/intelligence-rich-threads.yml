name: Intelligence rich threads (manual development validation)

on:
  workflow_dispatch:

permissions:
  contents: read

# One environment for both frameworks and all six rows; never cancel another run.
concurrency:
  group: intelligence-rich-threads-development
  cancel-in-progress: false

jobs:
  connected-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: intelligence-rich-threads-development
    env:
      NX_DAEMON: "false"
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Install workspace tooling
        run: pnpm install --filter CopilotKit --frozen-lockfile --ignore-scripts
      - name: Install locked browser driver
        run: pnpm nx run intelligence-smoke:rich-threads-setup
      - name: Install Chromium system dependencies
        run: pnpm nx run intelligence-smoke:rich-threads-browser-system-deps
      - name: Check driver controls
        run: pnpm nx run intelligence-smoke:rich-threads-driver-test
      - name: Materialize approved private development configuration
        env:
          RICH_THREADS_CONFIG_JSON: ${{ secrets.RICH_THREADS_CONFIG_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          assert.ok(process.env.RICH_THREADS_CONFIG_JSON, 'Configure the approved environment manifest; no substitute fixture is allowed');
          const config = JSON.parse(process.env.RICH_THREADS_CONFIG_JSON);
          assert.equal(config.purpose, 'development');
          assert.equal(config.provider, 'docker');
          config.directory = join(process.env.RUNNER_TEMP, 'rich-thread-owned');
          config.dockerHost = 'unix:///var/run/docker.sock';
          delete config.dependenciesDirectory;
          mkdirSync(config.directory, {mode: 0o700});
          writeFileSync(join(process.env.RUNNER_TEMP, 'rich-threads-private.json'), JSON.stringify(config), {mode: 0o600, flag: 'wx'});
          NODE
      - name: Run both frameworks through all six real rows
        timeout-minutes: 45
        run: >-
          pnpm nx run intelligence-smoke:rich-threads --
          --framework=mastra,strands-typescript --rows=1,2,3,4,5,6
          --config="$RUNNER_TEMP/rich-threads-private.json"
          --output="$RUNNER_TEMP/rich-threads-evidence"
      - name: Recover interrupted owned resources
        if: always()
        timeout-minutes: 5
        run: >-
          pnpm nx run intelligence-smoke:rich-threads-recover --
          --output="$RUNNER_TEMP/rich-threads-evidence"
          --docker-host=unix:///var/run/docker.sock
      - name: Preserve result and ownership receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rich-threads-development-evidence
          path: ${{ runner.temp }}/rich-threads-evidence
          if-no-files-found: warn
          retention-days: 14
