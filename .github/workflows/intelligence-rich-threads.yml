name: Intelligence bounded row1 (Railway trigger)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Railway run mode
        type: choice
        options: [single, acceptance, crash-recovery]
        default: single
        required: true

permissions:
  contents: read

# Scheduling, serialization, tests and recovery belong to the permanent Railway
# runner. This job only triggers it and exports immutable retained evidence.
jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
      - name: Trigger Railway execution and export results
        env:
          RICH_RUNNER_URL: ${{ vars.RICH_RUNNER_URL }}
          RICH_RUNNER_TOKEN: ${{ secrets.RICH_RUNNER_TOKEN }}
          RUN_MODE: ${{ inputs.mode }}
        run: >-
          node tools/intelligence-smoke/rich-threads/trigger.mjs
          --mode="$RUN_MODE" --output="$RUNNER_TEMP/railway-results"
      - name: Retain exported evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-row1-railway-evidence
          path: ${{ runner.temp }}/railway-results
          if-no-files-found: warn
          retention-days: 14
