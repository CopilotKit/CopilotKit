name: Intelligence runner staging deployment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/railway-runner-deploy/**
      - .github/workflows/intelligence-rich-threads-deploy.yml
  push:
    branches: [main, fix/PNI-605-registry-activation]
    paths:
      - tools/railway-runner-deploy/**
      - .github/workflows/intelligence-rich-threads-deploy.yml

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: intelligence-runner-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: pnpm install --filter CopilotKit --frozen-lockfile --ignore-scripts
      - name: Test and lint deployment control
        run: pnpm nx run-many -t test,lint --projects=railway-runner-deploy --parallel=1
      - name: Validate reviewed release provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/railway-runner-deploy/release.mjs --validate tools/railway-runner-deploy/releases/staging.json

  deploy:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'CopilotKit/CopilotKit' &&
      github.repository_id == '655515393' &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/fix/PNI-605-registry-activation' &&
        vars.RICH_RUNNER_DEPLOY_BOOTSTRAP_SHA != '' &&
        github.sha == vars.RICH_RUNNER_DEPLOY_BOOTSTRAP_SHA))
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Drain, deploy reviewed staging image, verify, and resume
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RICH_RUNNER_TOKEN: ${{ secrets.RICH_RUNNER_TOKEN }}
          RICH_RUNNER_DEPLOY_BOOTSTRAP_SHA: ${{ vars.RICH_RUNNER_DEPLOY_BOOTSTRAP_SHA }}
        run: node tools/railway-runner-deploy/run.mjs
      - name: Retain redacted deployment receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-deployment-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-deployment-receipt/deployment-receipt.json
          if-no-files-found: warn
          retention-days: 90
