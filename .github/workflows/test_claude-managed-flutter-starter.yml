name: test / Claude Managed Agents Flutter template

on:
  pull_request:
    paths:
      - templates/claude-managed-agents-flutter/**
      - .github/workflows/test_claude-managed-flutter-starter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-managed-flutter-starter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: templates/claude-managed-agents-flutter
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/claude-managed-agents-flutter/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - run: npm ci
      - run: npm run setup:flutter
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: flutter analyze
        working-directory: templates/claude-managed-agents-flutter/flutter
      - run: flutter test
        working-directory: templates/claude-managed-agents-flutter/flutter
      - run: flutter build web --dart-define=RUNTIME_URL=http://localhost:8200/api/copilotkit
        working-directory: templates/claude-managed-agents-flutter/flutter
