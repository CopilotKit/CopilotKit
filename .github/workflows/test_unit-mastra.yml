name: test / unit / mastra

on:
  pull_request:
    paths:
      - "showcase/integrations/mastra/**"
      - ".github/workflows/test_unit-mastra.yml"
  push:
    branches: [main]
    paths:
      - "showcase/integrations/mastra/**"
      - ".github/workflows/test_unit-mastra.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegation-memory:
    name: Mastra delegation memory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: showcase/integrations/mastra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: showcase/integrations/mastra/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check delegation memory isolation
        run: npm test -- tests/vitest/subagents-working-memory.test.ts
