name: static / channels zod

# PE-30. Fails when a published `packages/channels*` package declares a `zod`
# range in a field a consumer's resolver acts on.
#
# The conflict this prevents is between two things we publish: the channels
# packages asked for `^3.25.76`, and the Microsoft agents packages they sit
# beside pin `zod` at exactly `3.25.75`. Because both constraints come from
# our own packages, nothing an application declares can resolve it. It shipped
# twice — OSS-1173, then again through the umbrella package in PE-30 — so it
# gets a check rather than a third fix.
#
# No network and ~0.05s of work, so it runs on every pull request. The dynamic
# half is a clean install of @copilotkit/channels plus the Microsoft agents
# packages, which is recorded in the PE-30 pull request rather than automated:
# it needs a published version to install.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only a change to a channels manifest or to the validator itself can
    # introduce a violation. The unconditional `push: main` run above is the
    # backstop for anything that lands another way.
    paths:
      - "packages/channels*/package.json"
      - "scripts/validate-channels-zod.mjs"
      - "scripts/__tests__/validate-channels-zod.test.mjs"
      - "scripts/project.json"
      - ".github/workflows/static_channels-zod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Runs the validator's own unit tests (which encode the pre-fix
      # manifests as fixtures) and then the validator itself against the
      # working tree. Same target a developer runs locally.
      - name: Test validator and check channels manifests
        run: pnpm nx run repo-scripts:validate-channels-zod
