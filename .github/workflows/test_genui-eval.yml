name: test / genui-eval

on:
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "tools/genui-eval/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "nx.json"
      - ".github/workflows/test_genui-eval.yml"
  push:
    branches: [main]
    paths:
      - "tools/genui-eval/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "nx.json"
      - ".github/workflows/test_genui-eval.yml"

permissions:
  contents: read

concurrency:
  group: genui-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: "false"
      NX_TUI: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test the offline eval pipeline
        run: pnpm nx run-many -t typecheck,test -p genui-eval --parallel=1 --output-style=static
