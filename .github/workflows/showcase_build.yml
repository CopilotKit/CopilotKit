name: "CPK-8652 Recovery Registry Audit"

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  registry-metadata:
    if: github.repository == 'CopilotKit/CopilotKit' && github.ref == 'refs/heads/contextablemark/cpk-8652-publish-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - name: Authenticate for package reads only
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Inspect only shell and webhook latest metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess

          targets = {
              "ghcr.io/copilotkit/showcase-shell:latest": "sha256:160bd5456e567de81cd041a22077bb0844aa7436c3b823f5cd59b0a6df4942ab",
              "ghcr.io/copilotkit/showcase-eval-webhook:latest": "sha256:6f76f7fd6091f52d2cd150b9f26690b0b63221073093b9d22a9e2afe82f3fb59",
          }
          report = {"scope": "Registry metadata reads only; no container execution or deployment", "images": []}

          def digest(value):
              if not isinstance(value, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
                  raise ValueError("Invalid registry digest")
              return value

          for name, configured in targets.items():
              result = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", name, "--format", "{{json .Manifest}}"],
                  check=True, text=True, capture_output=True, timeout=90,
              )
              manifest = json.loads(result.stdout)
              platforms = []
              for item in manifest.get("manifests", []):
                  platform = item.get("platform", {})
                  platforms.append({
                      "digest": digest(item["digest"]),
                      "mediaType": item["mediaType"],
                      "platform": {key: platform[key] for key in ("os", "architecture", "variant") if key in platform},
                  })
              report["images"].append({
                  "name": name,
                  "mediaType": manifest["mediaType"],
                  "digest": digest(manifest["digest"]),
                  "platforms": platforms,
                  "stagingConfiguredDigest": digest(configured),
                  "latestDigestEqualsStagingConfigured": manifest["digest"] == configured,
                  "stagingConfiguredMatchesPlatforms": [item["platform"] for item in platforms if item["digest"] == configured],
              })
          encoded = json.dumps(report, indent=2)
          print(encoded, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Read-only registry digest comparison\n\n```json\n" + encoded + "\n```\n")
          PYTHON

      - name: Log out
        if: always()
        shell: bash
        run: docker logout ghcr.io
