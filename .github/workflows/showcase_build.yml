name: "CPK-8652 Candidate Only"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-candidate:
    if: github.repository == 'CopilotKit/CopilotKit' && github.ref == 'refs/heads/contextablemark/cpk-8652-publish-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_REPOSITORY: ghcr.io/copilotkit/showcase-harness-candidates
      SOURCE_COMMIT: ff1178a6a08ec9cc55dd2cce678e27d07e26a27a
      PATCH_SHA256: c28825af3fac91ab29f5c0ce8d1f7ee9ff7e0ae381a7d4e52ef1daf4e1c5de3c
    steps:
      - name: Check out exact production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ff1178a6a08ec9cc55dd2cce678e27d07e26a27a
          persist-credentials: false
          lfs: false

      - name: Apply and audit the two Node base pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("showcase/harness/Dockerfile")
          data = p.read_bytes()
          assert hashlib.sha256(data).hexdigest() == "ea00e4ed70360d9a9fd5a2900de96038c95ce36d7b25c58f1d19eaec0b2c7dd2"
          pins = [
              (b"FROM node:22-alpine AS build\n", b"FROM node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914 AS build\n"),
              (b"FROM node:22-bookworm-slim\n", b"FROM node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d\n"),
          ]
          for old, new in pins:
              assert data.count(old) == 1
              data = data.replace(old, new)
          assert hashlib.sha256(data).hexdigest() == "89b1a0e76e9a2d97712ec4b2a028fe64eca73b88ef59313a35c91ef400a49889"
          p.write_bytes(data)
          PY
          test "$(git diff --name-only)" = "showcase/harness/Dockerfile"
          git diff --check
          git diff --exit-code -- package.json pnpm-lock.yaml showcase/harness/package.json
          git diff -- showcase/harness/Dockerfile

      - name: Authenticate with this job's package token
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Start an isolated BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name cpk8652-candidate --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish only the isolated candidate tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="${CANDIDATE_REPOSITORY}:cpk-8652-ff1178a6-node22.23.4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export CANDIDATE_IMAGE="$image"
          python3 - <<'PY'
          import os, subprocess
          p = subprocess.run(["docker", "buildx", "imagetools", "inspect", os.environ["CANDIDATE_IMAGE"]], capture_output=True, text=True)
          if p.returncode == 0:
              raise SystemExit("Refusing to overwrite an existing candidate tag")
          error = p.stderr.lower()
          if not any(s in error for s in ["not found", "manifest unknown", "name unknown"]):
              raise SystemExit("Cannot establish candidate tag absence: " + p.stderr)
          PY
          docker buildx build \
            --platform linux/amd64 \
            --provenance mode=max \
            --push \
            --metadata-file "$RUNNER_TEMP/cpk-8652-build-metadata.json" \
            --label "org.opencontainers.image.source=https://github.com/CopilotKit/CopilotKit" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "ai.copilotkit.hotfix.patch.sha256=$PATCH_SHA256" \
            --label "ai.copilotkit.hotfix.issue=CPK-8652" \
            --tag "$image" \
            --file showcase/harness/Dockerfile .
          digest="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "cpk-8652-build-metadata.json")))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable="${CANDIDATE_REPOSITORY}@${digest}"
          docker pull --platform linux/amd64 "$immutable"
          test "$(docker run --rm --network none --platform linux/amd64 "$immutable" node --version)" = "v22.23.4"
          docker run --rm --network none --platform linux/amd64 "$immutable" node --input-type=module -e \
            'import {chromium} from "playwright"; const b=await chromium.launch({headless:true,args:["--no-sandbox"]}); const p=await b.newPage(); await p.setContent("<title>CPK-8652 runtime smoke</title>"); console.log(JSON.stringify({node:process.version,chromium:b.version(),title:await p.title()})); await b.close();'
          printf 'image=%s\n' "$immutable" >> "$GITHUB_OUTPUT"
          {
            printf 'Candidate only: %s\n\n' "$immutable"
            printf 'Tag: %s\n\n' "$image"
            printf 'Source: %s; additional patch SHA256: %s\n\n' "$SOURCE_COMMIT" "$PATCH_SHA256"
            printf 'Node version and Chromium launch verified after digest pull. Remote role canary and production approval remain open.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of registry
        if: always()
        shell: bash
        run: docker logout ghcr.io
