name: "Showcase: Refresh Compatibility"

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Dashboard environment to refresh"
        type: choice
        options: [both, staging, prod]
        default: both
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      services_csv:
        description: "Changed/deployed services; only framework changes trigger collection"
        type: string
        default: all

permissions:
  contents: read

jobs:
  audit:
    name: Compatibility (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: railway
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'prod' && '["prod"]' || inputs.environment == 'staging' && '["staging"]' || '["staging","prod"]') }}
    concurrency:
      group: showcase-compatibility-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      NX_DAEMON: "false"
      NX_TUI: "false"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Skip changes outside framework integrations
        id: changes
        env:
          SERVICES_CSV: ${{ inputs.services_csv || 'all' }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          changed = set(os.environ['SERVICES_CSV'].split(','))
          slugs = [p.name for p in pathlib.Path('showcase/integrations').iterdir() if (p / 'manifest.yaml').is_file()]
          refresh = 'all' in changed or any(slug in changed or 'showcase-' + slug in changed for slug in slugs)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('refresh=' + str(refresh).lower() + '\n')
          PY
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.refresh == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.refresh == 'true'
        with:
          node-version: "22"
      - name: Install existing audit dependencies
        if: steps.changes.outputs.refresh == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @copilotkit/showcase-scripts... --filter @copilotkit/showcase-harness...
          npm ci --prefix showcase/shell-dashboard --ignore-scripts --no-audit --no-fund
      - name: Login to GHCR for image metadata
        if: steps.changes.outputs.refresh == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit deployed source commits and publish saved results
        if: steps.changes.outputs.refresh == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHARED_SECRET: ${{ secrets.SHOWCASE_HARNESS_SHARED_SECRET }}
          AUDIT_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          pnpm exec nx exec --projects=@copilotkit/showcase-scripts -- node "$GITHUB_WORKSPACE/showcase/shell-dashboard/node_modules/tsx/dist/cli.mjs" "$GITHUB_WORKSPACE/showcase/shell-dashboard/scripts/refresh-compatibility.ts" --environment "$AUDIT_ENVIRONMENT" --out "$RUNNER_TEMP/compatibility/report.json"
      - name: Preserve audit report
        if: always() && steps.changes.outputs.refresh == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compatibility/report.json
          if-no-files-found: ignore
          retention-days: 30
