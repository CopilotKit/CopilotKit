name: test / unit-shell-docs

on:
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "showcase/shell-docs/**"
      - "showcase/scripts/**"
      - "showcase/harness/src/shared/**"
      - "showcase/integrations/**"
      - "showcase/angular/src/**"
      - "showcase/shared/**"
      - "showcase/features/**"
      - "showcase/*.json"
      - "examples/integrations/ms-agent-framework-dotnet/**"
      - "examples/v1/travel/agent/uv.lock"
      - "packages/runtime/package.json"
      # react-native-generative-ui-docs.test.ts pins the docs to these.
      - "packages/react-native/README.md"
      - "packages/react-native/USAGE.md"
      - "packages/react-native/src/CopilotKitProvider.tsx"
      - "packages/react-native/src/generative-ui/**"
      - "packages/core/src/core/core.ts"
      - "packages/core/src/core/run-handler.ts"
      - "packages/react-core/package.json"
      - "packages/react-core/src/v2/generative-ui/runtime-context.ts"
      - "packages/shared/package.json"
      - ".github/workflows/test_unit-shell-docs.yml"
  push:
    branches: [main]
    paths:
      - "showcase/shell-docs/**"
      - "showcase/scripts/**"
      - "showcase/harness/src/shared/**"
      - "showcase/integrations/**"
      - "showcase/angular/src/**"
      - "showcase/shared/**"
      - "showcase/features/**"
      - "showcase/*.json"
      - "examples/integrations/ms-agent-framework-dotnet/**"
      - "examples/v1/travel/agent/uv.lock"
      - "packages/runtime/package.json"
      # react-native-generative-ui-docs.test.ts pins the docs to these.
      - "packages/react-native/README.md"
      - "packages/react-native/USAGE.md"
      - "packages/react-native/src/CopilotKitProvider.tsx"
      - "packages/react-native/src/generative-ui/**"
      - "packages/core/src/core/core.ts"
      - "packages/core/src/core/run-handler.ts"
      - "packages/react-core/package.json"
      - "packages/react-core/src/v2/generative-ui/runtime-context.ts"
      - "packages/shared/package.json"
      - ".github/workflows/test_unit-shell-docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: shell-docs unit suite
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Depot runner OIDC auth.
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: showcase/shell-docs/package-lock.json

      # shell-docs is outside the pnpm workspace and has no Nx target.
      # postinstall only applies patches/, which these checks do not need.
      - name: Install shell-docs dependencies
        working-directory: showcase/shell-docs
        run: npm ci --ignore-scripts

      - name: Generate docs data
        working-directory: showcase/shell-docs
        run: npm run showcase-data

      - name: Typecheck shell-docs
        working-directory: showcase/shell-docs
        run: npm run typecheck

      - name: Lint shell-docs
        working-directory: showcase/shell-docs
        run: npm run lint

      # The checkout has Git LFS pointer files for the page images, and
      # compiling a page reads the size of each image it shows.
      - name: Fetch the page images
        working-directory: showcase/shell-docs
        run: node scripts/fetch-lfs.mjs

      - name: Compile every docs page
        working-directory: showcase/shell-docs
        run: npm run check-live-mdx
