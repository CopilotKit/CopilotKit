name: "showcase / eval-webhook / build"

on:
  push:
    branches: [main]
    paths:
      - "showcase/eval-webhook/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: showcase/eval-webhook
          push: true
          tags: |
            ghcr.io/copilotkit/showcase-eval-webhook:latest
            ghcr.io/copilotkit/showcase-eval-webhook:${{ github.sha }}
