name: test / mutation

# Mutation testing (Stryker) for core, runtime and react-core. It changes the
# source in small ways and checks that a test fails each time; the score is the
# share of changes the tests catch. See scripts/mutation/README.md.
#
# Too slow for every PR, so it runs weekly and on demand. Stryker's incremental
# file is cached between runs, so a rerun only retests mutants whose code or
# covering tests changed. Scheduled runs only fire for workflows on the default
# branch.
on:
  schedule:
    # Mondays 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore the incremental cache and retest every mutant"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  mutation:
    name: ${{ matrix.project }}
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 300
    # id-token: write is required for Depot OIDC auth (runs-on: depot-ubuntu-*).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: "@copilotkit/core"
            dir: packages/core
          - project: "@copilotkit/runtime"
            dir: packages/runtime
          - project: "@copilotkit/react-core"
            dir: packages/react-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Omit `version:` so pnpm/action-setup inherits from the repo's
        # `packageManager` field in package.json (via corepack).
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22
        # Stryker 10 needs Node 22 or newer.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Stryker incremental file
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.dir }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ matrix.dir }}-${{ github.ref_name }}-
            stryker-incremental-${{ matrix.dir }}-

      - name: Run mutation tests
        env:
          PROJECT: ${{ matrix.project }}
          STRYKER_CONCURRENCY: "14"
        run: pnpm nx run "$PROJECT:test:mutation"

      - name: Save Stryker incremental file
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.dir }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Write job summary
        if: ${{ !cancelled() }}
        env:
          DIR: ${{ matrix.dir }}
        run: node scripts/mutation/summarize.mjs "$DIR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: |
            ${{ matrix.dir }}/reports/mutation/mutation.html
            ${{ matrix.dir }}/reports/mutation/mutation.json
          retention-days: 30
          if-no-files-found: warn
