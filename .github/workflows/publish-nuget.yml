name: release / NuGet

on:
  pull_request:
    paths:
      - .github/workflows/publish-nuget.yml
      - packages/runtime-dotnet/**
      - packages/intelligence-agent-framework-dotnet/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested packages to NuGet.org
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test and pack the client, runtime, and adapter
        run: pnpm nx run-many -t test,build,pack -p runtime-dotnet,intelligence-agent-framework-dotnet --parallel=1
      - name: Test installation without source references
        run: pnpm nx run intelligence-agent-framework-dotnet:verify-distribution
      - name: Collect NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          cp packages/runtime-dotnet/src/bin/packages/*.nupkg artifacts/
          cp packages/intelligence-agent-framework-dotnet/src/bin/Release/*.nupkg artifacts/
          test "$(find artifacts -name '*.nupkg' | wc -l)" -eq 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"
      - name: Require the NuGet account name
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"
      # NuGet.org policy: CopilotKit/CopilotKit, publish-nuget.yml,
      # environment nuget, package owner CopilotKit.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish client before dependent packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for package in CopilotKit.Intelligence CopilotKit.Intelligence.Runtime CopilotKit.Intelligence.AgentFramework; do
            files=(artifacts/"$package".[0-9]*.nupkg)
            test "${#files[@]}" -eq 1
            test -f "${files[0]}"
            dotnet nuget push "${files[0]}" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
