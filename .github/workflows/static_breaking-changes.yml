name: static / breaking changes

# PRs into a release line (e.g. `2.0.0`) that break an API must add a codemod
# or a migration-guide entry. The rule itself lives in dangerfile.ts.
on:
  pull_request:
    branches: ["[0-9]+.[0-9]+.[0-9]+"]
    # `edited` re-runs the check when the title or description changes.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Danger posts review comments on the PR via GITHUB_TOKEN
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Omit `version:` so pnpm/action-setup inherits from the repo's
        # `packageManager` field in package.json (via corepack).
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          # setup-node built-in cache is fork-safe (fork PRs can't write to base repo cache)
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The rule diffs the committed manifest, so it must match the source.
      - name: Check the public API manifest
        run: pnpm check:public-api-manifest

      - name: Run Danger
        run: pnpm exec danger ci --id breaking-changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
