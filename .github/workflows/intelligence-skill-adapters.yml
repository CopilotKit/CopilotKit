name: test / learned-skill adapters

on:
  # Stacked PRs target their preceding branch, so this lane has no base-branch filter.
  pull_request:
    paths:
      - "packages/intelligence-*/**"
      - "packages/runtime/**"
      - "packages/runtime-python/**"
      - "packages/runtime-dotnet/sdk/**"
      - "packages/runtime-dotnet/sdk-tests/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tools/learned-skill-conformance/**"
      - "tools/compatibility-monitor/**"
      - ".github/workflows/intelligence-compatibility-monitor.yml"
      - "nx.json"
      - ".github/workflows/intelligence-skill-adapters.yml"
  push:
    branches: [main]
    paths:
      - "packages/intelligence-*/**"
      - "packages/runtime/**"
      - "packages/runtime-python/**"
      - "packages/runtime-dotnet/sdk/**"
      - "packages/runtime-dotnet/sdk-tests/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tools/learned-skill-conformance/**"
      - "tools/compatibility-monitor/**"
      - ".github/workflows/intelligence-compatibility-monitor.yml"
      - "nx.json"
      - ".github/workflows/intelligence-skill-adapters.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  NX_TUI: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  python-core:
    name: Python registry and canonical client
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.7"
          enable-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compatibility dispatch validation
        run: pnpm nx run compatibility-monitor:test
      - run: pnpm nx run-many -t test,lint,typecheck -p runtime-python,intelligence-delivery-python-core --parallel=1
      - name: Independent Python wheel ownership
        run: pnpm nx run learned-skill-conformance:verify-python-distributions

  python-framework:
    name: ${{ matrix.project }} / ${{ matrix.compatibility }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [intelligence-langgraph-python, intelligence-adk-python]
        compatibility: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.7"
          enable-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Native framework compatibility
        run: pnpm nx run "${{ matrix.project }}:test-${{ matrix.compatibility }}"
      - name: Validate independently built distribution
        run: pnpm nx run-many -t lint,typecheck,build,verify-distribution -p "${{ matrix.project }}" --parallel=1

  dotnet-framework:
    name: Agent Framework / ${{ matrix.compatibility }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compatibility: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Canonical .NET transport tests
        run: pnpm nx exec --projects=runtime-dotnet -- dotnet run --project "$PWD/packages/runtime-dotnet/sdk-tests/Intelligence.Tests.csproj"
      - name: Native framework and shared registry contracts
        run: pnpm nx run "intelligence-agent-framework-dotnet:test-${{ matrix.compatibility }}"
      - name: Build independent NuGet package
        run: pnpm nx run intelligence-agent-framework-dotnet:verify-distribution

  typescript-framework:
    name: TypeScript ${{ matrix.project }} / ${{ matrix.compatibility }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compatibility: [minimum, latest]
        include:
          - project: intelligence-langgraph
            node: "20.19.0"
          - project: intelligence-mastra
            node: "22.13.0"
        project: [intelligence-langgraph, intelligence-mastra]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build adapter and canonical client
        run: pnpm nx run @copilotkit/${{ matrix.project }}:build
      - name: Shared registry contracts
        run: pnpm nx test @copilotkit/intelligence-delivery-core
      - name: Native framework and installed distribution compatibility
        run: pnpm nx run "@copilotkit/${{ matrix.project }}:test-${{ matrix.compatibility }}"
      - name: Validate package exports and types
        run: pnpm nx run-many -t check-types,publint,attw -p @copilotkit/${{ matrix.project }} --parallel=1
      - name: Native delivery against HTTP and AIMock
        if: matrix.project == 'intelligence-mastra' && matrix.compatibility == 'latest'
        run: pnpm nx run learned-skill-conformance:test-native-delivery-drivers

  builtin-agent:
    name: Built-in agent installed consumer
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record exact lockfile dependency versions
        env:
          COMPATIBILITY_SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const version = name => JSON.parse(readFileSync(`packages/runtime/node_modules/${name}/package.json`, 'utf8')).version;
          writeFileSync('builtin-request.json', JSON.stringify({
            schemaVersion: 1, requestId: randomUUID(), adapterId: 'builtin-ts',
            track: 'source', sourceSha: process.env.COMPATIBILITY_SOURCE_SHA,
            dependencies: { ai: version('ai'), zod: version('zod') }, experimental: false,
          }));
          NODE
      - name: Test installed built-in agent
        run: pnpm nx run compatibility-monitor:run --args="builtin-request.json $PWD builtin-evidence"
      - name: Preserve built-in consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: builtin-agent-compatibility
          path: builtin-evidence/
          if-no-files-found: warn
          retention-days: 90
