name: Package licenses

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/LICENSE"
      - "scripts/package-licenses/**"
      - ".github/workflows/package-licenses.yml"
      - ".github/workflows/publish*.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test archive rejection paths
        run: pnpm nx run package-licenses:test
      - name: Check package metadata and packed license files
        run: pnpm nx run package-licenses:pack
