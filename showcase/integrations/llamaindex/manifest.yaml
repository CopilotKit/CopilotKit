    highlight:
      - src/agents/beautiful_chat_agent.py
      - src/app/demos/beautiful-chat/page.tsx
      - src/app/api/copilotkit/route.ts
    agent:
      path: "/beautiful-chat/run"
    runtime:
      openGenerativeUI: true
