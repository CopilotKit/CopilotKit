name: LlamaIndex
slug: llamaindex
category: emerging
language: python
logo: /logos/llamaindex.svg
description: CopilotKit integration with LlamaIndex
partner_docs: null
repo: https://github.com/CopilotKit/CopilotKit/tree/main/showcase/integrations/llamaindex
copilotkit_version: 2.0.0
deployed: true
demo_frontend: unified
docs_mode: authored
sort_order: 110
generative_ui:
  - constrained-explicit
  - a2ui-fixed-schema
  - a2ui-dynamic-schema
interaction_modalities:
  - sidebar
  - embedded
  - chat
not_supported_features:
  # UPSTREAM GAP, not an oversight. `multimodal` (Attachments) has never worked
  # on LlamaIndex: the pinned `llama-index-protocols-ag-ui==0.2.2` adapter
  # (`llama_index/protocols/ag_ui/utils.py:82-85`) passes an AG-UI UserMessage's
  # `content` straight into `ChatMessage(...)`. For a text-only turn that is a
  # plain string and works, but an attachment turn carries a LIST of AG-UI
  # content-part models, which pydantic routes into `ChatMessage.blocks` — a
  # union discriminated on `block_type`, a field AG-UI's TextInputContent /
  # ImageInputContent / BinaryInputContent do not have. Every attachment turn
  # therefore dies with `3 validation errors for ChatMessage / Unable to extract
  # tag using discriminator 'block_type' [type=union_tag_not_found,
  # input_type=TextInputContent]`. Fixing it needs an upstream content-part ->
  # ContentBlock conversion (or replacing `get_ag_ui_workflow_router` for this
  # demo). Marked not-supported so the cell reads unsupported (gray/🚫) rather
  # than green (which would claim it works) or red (which would claim a
  # regression). The demo entry stays wired below, matching every other
  # not-supported feature here.
  - multimodal
  - shared-state-streaming
  - gen-ui-interrupt
  - interrupt-headless
  - hitl-in-chat-booking
  - reasoning-default-render
  - agentic-chat-reasoning
  - tool-rendering-reasoning-chain
features:
  - beautiful-chat
  - cli-start
  - agentic-chat
  - reasoning-custom
  - gen-ui-tool-based
  - mcp-apps
  - reasoning-default
  - frontend-tools
  - frontend-tools-async
  - hitl-in-chat
  - hitl-in-app
  - hitl
  - tool-rendering
  - tool-rendering-default-catchall
  - tool-rendering-custom-catchall
  - gen-ui-agent
  - declarative-gen-ui
  - a2ui-fixed-schema
  # DROPPED: `byoc-json-render` / `byoc-hashbrown`. Both ids are marked
  # `deprecated` in showcase/shared/feature-registry.json, superseded by
  # `declarative-json-render` / `declarative-hashbrown`. This package's demo
  # folders already carry the NEW names and the unified app only ships pages for
  # the new ids, so the legacy ids named nothing in this app: they sat in
  # `features` with no `demos[]` row, which made the cell resolve as supported
  # and then 404 at POST /api/llamaindex/<id>. Re-adding them under the NEW ids
  # is a follow-up: the agents ARE served (src/agent_server.py includes
  # byoc_json_render_router at prefix "/byoc-json-render" and
  # byoc_hashbrown_router at "/byoc-hashbrown", so the AG-UI endpoints are
  # /byoc-*/run), so the rows need `id: declarative-*` with `agent.path` pointing
  # at those legacy backend prefixes.
  - auth
  - voice
  - open-gen-ui
  - open-gen-ui-advanced
  - agent-config
  - shared-state-read-write
  - subagents
  - prebuilt-sidebar
  - prebuilt-popup
  - chat-slots
  - chat-customization-css
  - headless-simple
  - headless-complete
  - readonly-state-agent-context
  - shared-state-read
a2ui_pattern: schema-loading
interrupt_pattern: promise-based
agent_config_pattern: shared-state
auth_pattern: runtime-onrequest
demos:
  - id: cli-start
    name: CLI Start Command
    description: Copy-paste command to clone the canonical starter
    tags:
