name: Google Antigravity
slug: google-antigravity
category: agent-framework
language: python
logo: /logos/google-antigravity.svg
description: >-
  CopilotKit integration with Google Antigravity through the ag-ui-antigravity
  adapter. The SDK drives a Go harness subprocess with real file and shell
  access; hooks and client tools park across AG-UI runs without a proxy tool.
partner_docs: https://antigravity.google/product/antigravity-sdk/
repo: https://github.com/CopilotKit/CopilotKit/tree/main/showcase/integrations/google-antigravity
copilotkit_version: 2.0.0
deployed: false
docs_mode: generated
sort_order: 61
generative_ui:
  - constrained-explicit
interaction_modalities:
  - sidebar
  - embedded
  - chat
managed_platform:
  name: Google Antigravity
  url: https://antigravity.google
interrupt_pattern: promise-based
auth_pattern: runtime-onrequest
features:
  - cli-start
  - beautiful-chat
  - agentic-chat
  - prebuilt-sidebar
  - prebuilt-popup
  - chat-slots
  - chat-customization-css
  - headless-simple
  - headless-complete
  - voice
  - frontend-tools
  - frontend-tools-async
  - hitl-in-chat
  - hitl-in-app
  - gen-ui-tool-based
  - tool-rendering
  - tool-rendering-default-catchall
  - tool-rendering-custom-catchall
  - auth
  - subagents
  - mcp-apps
not_supported_features:
  # The adapter forwards only user messages to Antigravity; RunAgentInput
  # state, context and forwardedProps are not folded into the prompt yet.
  - shared-state-read
  - readonly-state-agent-context
  - agent-config
  # No state-writer path: STATE_SNAPSHOT only comes from structured_output at
  # the end of a turn, so live step lists and agent-written notes cannot stream.
  - gen-ui-agent
  - shared-state-read-write
  - shared-state-streaming
  # Non-text message parts are dropped by the adapter.
  - multimodal
  # Quarantined upstream (react-core resume-path hook bug); langgraph-python
  # declares these too.
  - gen-ui-interrupt
  - interrupt-headless
  # The Go harness drops the model's reasoning deltas: an aimock response
  # carrying `reasoning_content` streams back as plain answer text and the
  # adapter never sees a THINKING step, so no reasoning message renders.
  - reasoning-default
  - reasoning-custom
  # Same root cause: this cell asserts one reasoning-block mount per turn.
  - tool-rendering-reasoning-chain
  # Declarative / open generative UI not investigated for this adapter yet.
  - declarative-gen-ui
  - a2ui-fixed-schema
  - a2ui-recovery
  - declarative-hashbrown
  - declarative-json-render
  - open-gen-ui
  - open-gen-ui-advanced
demos:
  - id: cli-start
    name: CLI Start Command
    description: Copy-paste command to clone the canonical starter
    tags:
      - chat-ui
    command: "npx copilotkit@latest init --framework antigravity"
  - id: beautiful-chat
    name: Beautiful Chat
    description: Canonical polished starter chat — brand fonts, theme tokens, suggestion pills
    tags:
      - chat-ui
    route: /demos/beautiful-chat
    animated_preview_url:
    highlight:
      - src/agents/beautiful_chat.py
      - src/app/demos/beautiful-chat/page.tsx
      - src/app/demos/beautiful-chat/components/example-layout/index.tsx
      - src/app/demos/beautiful-chat/components/example-canvas/index.tsx
      - src/app/demos/beautiful-chat/components/generative-ui/charts/bar-chart.tsx
      - src/app/demos/beautiful-chat/components/generative-ui/charts/pie-chart.tsx
      - src/app/demos/beautiful-chat/hooks/use-example-suggestions.tsx
