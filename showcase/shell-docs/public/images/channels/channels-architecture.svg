<!-- Replace this asset in place with Mike's final Channels architecture diagram when it is available. -->
<svg width="1440" height="760" viewBox="0 0 1440 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Managed Channels architecture</title>
  <desc id="description">Messages travel from Slack or Microsoft Teams through CopilotKit Intelligence to a long-running Channels SDK process and its AG-UI agent, tools, and state.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="32" x2="1340" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="intelligence" x1="472" y1="190" x2="758" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="760" rx="32" fill="url(#background)"/>
  <text x="72" y="78" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Managed Channels architecture</text>
  <text x="72" y="116" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">CopilotKit manages the provider edge; your long-running process owns agent behavior and application state.</text>

  <rect x="54" y="154" width="812" height="544" rx="26" fill="#FFFFFF" fill-opacity="0.55" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="80" y="188" fill="#6D28D9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">MANAGED BY COPILOTKIT INTELLIGENCE</text>

  <g filter="url(#shadow)">
    <rect x="86" y="250" width="242" height="132" rx="20" fill="#FFFFFF"/>
    <circle cx="130" cy="294" r="20" fill="#4A154B"/>
    <path d="M124 282a6 6 0 0 1 6 6v6h-6a6 6 0 1 1 0-12Zm0 16h6v6a6 6 0 1 1-6-6Zm10-10a6 6 0 1 1 6 6h-6v-6Zm0 10h6a6 6 0 1 1-6 6v-6Z" fill="#FFFFFF"/>
    <text x="164" y="302" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Slack</text>
    <text x="118" y="346" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Socket Mode connection</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="426" width="242" height="132" rx="20" fill="#FFFFFF"/>
    <circle cx="130" cy="470" r="20" fill="#5B5FC7"/>
    <path d="M120 461h17v17h-17zM137 465h8a5 5 0 0 1 5 5v8h-13z" fill="#FFFFFF"/>
    <text x="164" y="478" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Microsoft Teams</text>
    <text x="118" y="522" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Azure Bot messaging edge</text>
  </g>

  <path d="M348 316H410" stroke="#64748B" stroke-width="3"/>
  <path d="M348 316L360 308V324L348 316Z" fill="#64748B"/>
  <path d="M410 316L398 308V324L410 316Z" fill="#64748B"/>
  <path d="M348 492H410" stroke="#64748B" stroke-width="3"/>
  <path d="M348 492L360 484V500L348 492Z" fill="#64748B"/>
  <path d="M410 492L398 484V500L410 492Z" fill="#64748B"/>

  <g filter="url(#shadow)">
    <rect x="430" y="238" width="386" height="332" rx="24" fill="url(#intelligence)"/>
    <circle cx="478" cy="290" r="24" fill="#FFFFFF" fill-opacity="0.18"/>
    <path d="M467 290c0-6 5-11 11-11s11 5 11 11-5 11-11 11-11-5-11-11Zm-7 21c6-6 12-8 18-8s12 2 18 8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="520" y="298" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">CopilotKit Intelligence</text>
    <line x1="464" y1="332" x2="782" y2="332" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <circle cx="478" cy="374" r="5" fill="#DDD6FE"/>
    <text x="498" y="380" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Provider credentials and setup</text>
    <circle cx="478" cy="418" r="5" fill="#DDD6FE"/>
    <text x="498" y="424" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Ingress, egress, and delivery status</text>
    <circle cx="478" cy="462" r="5" fill="#DDD6FE"/>
    <text x="498" y="468" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Durable delivery over Realtime Gateway</text>
    <circle cx="478" cy="506" r="5" fill="#DDD6FE"/>
    <text x="498" y="512" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">One active runtime, identical standbys</text>
  </g>

  <path d="M836 404H926" stroke="#64748B" stroke-width="3"/>
  <path d="M836 404L848 396V412L836 404Z" fill="#64748B"/>
  <path d="M926 404L914 396V412L926 404Z" fill="#64748B"/>
  <rect x="854" y="365" width="54" height="28" rx="14" fill="#E2E8F0"/>
  <text x="881" y="384" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">WSS</text>

  <rect x="902" y="154" width="484" height="544" rx="26" fill="#FFFFFF" fill-opacity="0.7" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="928" y="188" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">YOU RUN</text>

  <g filter="url(#shadow)">
    <rect x="944" y="238" width="400" height="332" rx="24" fill="#FFFFFF"/>
    <rect x="980" y="274" width="328" height="76" rx="16" fill="#0F172A"/>
    <text x="1006" y="306" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">@copilotkit/channels</text>
    <text x="1006" y="331" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Long-running SDK process</text>
    <rect x="980" y="374" width="152" height="74" rx="14" fill="#EEF2FF"/>
    <text x="1056" y="405" text-anchor="middle" fill="#3730A3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">AG-UI agent</text>
    <text x="1056" y="428" text-anchor="middle" fill="#6366F1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">per conversation</text>
    <rect x="1156" y="374" width="152" height="74" rx="14" fill="#ECFDF5"/>
    <text x="1232" y="405" text-anchor="middle" fill="#065F46" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Tools &amp; UI</text>
    <text x="1232" y="428" text-anchor="middle" fill="#059669" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">app behavior</text>
    <rect x="980" y="470" width="328" height="62" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1144" y="500" text-anchor="middle" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">StateStore + deployment</text>
    <text x="1144" y="522" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">memory by default; durable in production</text>
  </g>

  <text x="720" y="728" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Bidirectional arrows represent message delivery and agent responses.</text>
</svg>
