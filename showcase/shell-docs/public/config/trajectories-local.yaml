# Local evaluation only; layered after the two chart eval profiles.
global:
  security:
    allowInsecureImages: true
fullnameOverride: cpki
ingress:
  enabled: false
config:
  publicAppOrigin: http://localhost:8080
  appFrontendOrigin: http://localhost:8080
  allowedOrigins: http://localhost:8080,http://localhost:3000
  nodeEnv: production
auth:
  issuer: http://localhost:8081/realms/cpk-dev
  internalOrigin: http://cpki-keycloak:8081
  existingSecret: cpki-auth-local
  keycloakClient:
    redirectUris:
      - http://localhost:8080/auth/callback/enterprise-sso
    webOrigins:
      - http://localhost:8080
bootstrap:
  organizations:
    # Trajectories requires a UUID organization ID.
    - id: f3a81e9f-38e2-46a7-94ce-2d237d818b60
      slug: trajectories-poc
      name: Trajectories POC
      mappings:
        - role: org_member
          claimName: groups
          claimValue: acme-intelligence-users
appApi:
  realtimeClientUrl: ws://localhost:4401/client
  licenseSecret:
    existingSecret: trajectories-license
    key: license-token
  env:
    - name: FF_LEARNING_TRAJECTORIES
      value: "true"
    - name: FF_MANAGED_CHANNELS
      value: "false"
appFrontend:
  apiProxy:
    enabled: true
redis-subchart:
  image:
    repository: bitnamilegacy/redis
    tag: 7.4.3-debian-12-r0
keycloak:
  image:
    repository: bitnamilegacy/keycloak
  extraEnvVars:
    - name: KC_HOSTNAME
      value: http://localhost:8081
  service:
    type: LoadBalancer
    ports:
      http: 8081
  keycloakConfigCli:
    image:
      repository: bitnamilegacy/keycloak-config-cli
  postgresql:
    image:
      repository: bitnamilegacy/postgresql
realtimeGateway:
  host: localhost
  checkOrigin: "false"
  appApiInternalTokenSecret:
    name: trajectories-internal
    key: token
  env:
    - name: FF_LEARNING_TRAJECTORIES
      value: "true"
    - name: FF_MANAGED_CHANNELS
      value: "false"
learning:
  enabled: false
embeddings:
  enabled: false
analytics:
  enabled: false
threadCuller:
  enabled: false
