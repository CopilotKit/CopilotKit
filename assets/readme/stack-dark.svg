<svg xmlns="http://www.w3.org/2000/svg" width="880" height="548" viewBox="0 0 880 548" fill="none" role="img" aria-labelledby="t d">
  <title id="t">The agentic product stack</title>
  <desc id="d">Four layers, each building on the one below. 01 Connect: AG-UI Protocol, the open protocol between agents and users (open protocol). 02 Build: CopilotKit SDKs for React, Angular, Vue, React Native and Channels, with chat, generative UI, shared state and human-in-the-loop (MIT, open source). 03 Improve: CopilotKit Intelligence, with AG-UI Streams, User Memories, Automatic Learning and Product Analytics (cloud-hosted or self-hosted). 04 Deploy to your team: OpenBot, open-source AI coworkers that each get their own computer (MIT), and CopilotKit Soar, AI coworkers your company owns, powered by OpenBot (commercial).</desc>
